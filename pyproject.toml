[project]
name = "p2pyrate"
version = "0.1.0"
description = "BitTorrent client in pure Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.11.18",
    "async-timeout>=5.0.1",
    "asyncudp>=0.11.0",
    "bencode2>=0.3.26",
    "loguru>=0.7.3",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
dev-dependencies = [
    "debugpy>=1.8.14",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "pyright>=1.1.400",
    "ruff>=0.11.9",
    "scapy>=2.6.1",
    "tqdm>=4.67.1",
    "wat-inspector>=0.4.3",
]
